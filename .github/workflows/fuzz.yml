name: Fuzz
on:
  schedule: [{ cron: "0 3 * * 1" }]   # weekly
  workflow_dispatch:
jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - run: cargo fuzz run chunk -- -max_total_time=300
