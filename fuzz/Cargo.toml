[package]
name = "chunkwise-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
chunkwise = { path = "..", features = ["tiktoken-rs"] }

[[bin]]
name = "chunk"
path = "fuzz_targets/chunk.rs"
test = false
doc = false
bench = false

[[bin]]
name = "chunk_tokens"
path = "fuzz_targets/chunk_tokens.rs"
test = false
doc = false
bench = false

[workspace]
